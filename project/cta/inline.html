<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Devine Edge — Become the business an AI recommends</title>
<meta name="description" content="Drop your email. We send a 12-page audit of your AI search, Google, and lead-leak signals — no call required." />

<meta property="og:title" content="Become the business an AI recommends · Devine Edge" />
<meta property="og:description" content="One field. 12-page audit. 48 hours." />
<meta property="og:type" content="website" />

<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>

<style>
  /* ============================================================
     Devine Edge · CTA · V4 INLINE
     Context: footer / blog post inline
     Scoped under .cta-inline — safe to copy-paste into any page.
     ============================================================ */

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #F8F4EC;
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    color: #1A1A1A;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 56px 24px;
  }
  body.embed { background: transparent; padding: 0; min-height: 0; display: block; }
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(rgba(26,26,26,0.025) 1px, transparent 1.2px);
    background-size: 3px 3px;
    opacity: 0.6;
    mix-blend-mode: multiply;
  }
  body.embed::before { display: none; }

  .cta-inline {
    --ink: #1A1A1A;
    --mute: #6B635A;
    --mute2: #8F8579;
    --paper: #F8F4EC;
    --paper2: #FBF8F1;
    --card: #FFFFFF;
    --line: #E8E0CF;
    --blue: #1F8FFF;
    --blue50: #E3EFFF;
    --blue100: #B9D7FB;

    position: relative; z-index: 1;
    width: 100%; max-width: 720px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 22px;
  }
  .cta-inline .serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }

  /* Top row: mark + eyebrow */
  .cta-inline .top-row {
    display: inline-flex; align-items: center; gap: 14px;
    opacity: 0;
  }
  .cta-inline .top-row .mark { width: 28px; height: 30px; opacity: 0; transform: translateY(-30px); }
  .cta-inline .top-row .mark svg { width: 100%; height: 100%; display: block; }
  .cta-inline .top-row .mark svg polygon:first-child { fill: var(--ink); }
  .cta-inline .top-row .mark svg polygon:last-child  { fill: var(--blue); }
  .cta-inline .eyebrow {
    font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--blue);
    display: inline-flex; align-items: center; gap: 8px;
    opacity: 0;
  }
  .cta-inline .eyebrow::before { content: ''; width: 16px; height: 1px; background: var(--blue100); }

  /* Wordmark with center-out reveal */
  .cta-inline .wordmark-wrap {
    overflow: hidden;
    height: 56px;
    width: 100%;
    display: flex; justify-content: center;
    clip-path: inset(0 50% 0 50%);
  }
  .cta-inline .wordmark-wrap img { height: 56px; display: block; }

  .cta-inline h1 {
    margin: 0; font-size: 34px; font-weight: 500;
    letter-spacing: -0.026em; line-height: 1.1; max-width: 560px;
    opacity: 0; transform: translateY(8px);
  }
  .cta-inline h1 .serif { color: var(--blue); }

  .cta-inline .sub {
    margin: -4px 0 0; font-size: 14.5px; color: var(--mute);
    line-height: 1.55; max-width: 460px;
    opacity: 0;
  }

  /* Inline pill form */
  .cta-inline .inline-form {
    margin-top: 6px;
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 6px 6px 18px;
    width: 100%; max-width: 460px;
    opacity: 0; transform: translateY(14px);
    box-shadow: 0 1px 0 rgba(26,26,26,0.04), 0 10px 24px -16px rgba(26,26,26,0.18);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .cta-inline .inline-form:focus-within {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(31,143,255,0.12), 0 1px 0 rgba(26,26,26,0.04), 0 10px 24px -16px rgba(26,26,26,0.18);
  }
  .cta-inline .inline-form label {
    position: absolute; left: -9999px; top: -9999px;
  }
  .cta-inline .inline-form input {
    flex: 1; min-width: 0;
    border: none; background: transparent; outline: none;
    font: inherit; font-size: 14.5px; color: var(--ink); padding: 8px 0;
  }
  .cta-inline .inline-form input::placeholder { color: var(--mute2); }
  .cta-inline .inline-form button {
    appearance: none; border: none; background: var(--ink);
    color: var(--paper2); font: inherit; font-weight: 500; font-size: 14px;
    padding: 11px 18px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0;
    transition: transform .12s ease, background .2s ease;
  }
  .cta-inline .inline-form button:hover { background: var(--blue); }
  .cta-inline .inline-form button:active { transform: scale(0.98); }
  .cta-inline .inline-form button svg { width: 14px; height: 14px; }

  .cta-inline .fine {
    font-size: 11.5px; color: var(--mute2);
    opacity: 0;
  }

  /* Success */
  .cta-inline .success {
    display: none;
    align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--blue100);
    border-radius: 999px;
    padding: 10px 18px 10px 14px;
    font-size: 14px; color: var(--ink);
    box-shadow: 0 1px 0 rgba(26,26,26,0.04), 0 10px 24px -16px rgba(26,26,26,0.18);
  }
  .cta-inline.done .inline-form, .cta-inline.done .fine { display: none; }
  .cta-inline.done .success { display: inline-flex; }
  .cta-inline .success-dot {
    width: 22px; height: 22px; border-radius: 999px;
    background: var(--blue50); border: 1px solid var(--blue100);
    display: grid; place-items: center; color: var(--blue);
  }
  .cta-inline .success-dot svg { width: 12px; height: 12px; }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .cta-inline .top-row, .cta-inline .top-row .mark, .cta-inline .eyebrow,
    .cta-inline h1, .cta-inline .sub, .cta-inline .inline-form, .cta-inline .fine {
      opacity: 1 !important; transform: none !important;
    }
    .cta-inline .wordmark-wrap { clip-path: none !important; }
  }

  @media (max-width: 540px) {
    .cta-inline .wordmark-wrap img { height: 40px; }
    .cta-inline .wordmark-wrap { height: 40px; }
    .cta-inline h1 { font-size: 26px; }
    .cta-inline .inline-form { padding: 5px 5px 5px 14px; }
    .cta-inline .inline-form button { padding: 10px 14px; }
  }
</style>
</head>
<body>

  <section class="cta-inline" aria-labelledby="cta-inline-heading" data-cta="v4-inline" data-cta-context="footer-or-inline">

    <div class="top-row" data-toprow>
      <div class="mark" data-mark aria-hidden="true">
        <svg viewBox="0 0 118 126">
          <polygon points="0,0 115,0 73,23 26,23 26,101 77,102 115,125 0,125"></polygon>
          <polygon points="54,63 116,37 116,88"></polygon>
        </svg>
      </div>
      <span class="eyebrow" data-eyebrow>Free AI Visibility Audit</span>
    </div>

    <div class="wordmark-wrap" data-word>
      <img src="../assets/wordmark.svg" alt="Devine Edge" />
    </div>

    <h1 id="cta-inline-heading" data-h1>Become the business <span class="serif">an AI recommends.</span></h1>
    <p class="sub" data-sub>Drop your email. We send a 12-page audit of your AI search, Google, and lead-leak signals — no call required.</p>

    <form class="inline-form" data-cta-form data-form autocomplete="on" novalidate>
      <label for="cta-inline-email">Email</label>
      <input id="cta-inline-email" name="email" type="email" placeholder="you@business.com" autocomplete="email" required />
      <button type="submit">
        Get my audit
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <div class="success" role="status" aria-live="polite">
      <span class="success-dot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </span>
      You're on the list. Audit lands in your inbox within 48 hours.
    </div>

    <span class="fine" data-fine>We reply in 48 hours.</span>

  </section>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get('embed') === '1') document.body.classList.add('embed');

  const root = document.querySelector('.cta-inline');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function play() {
    if (reduce || typeof anime === 'undefined') return;

    anime.set(root.querySelector('[data-toprow]'),  { opacity: 0 });
    anime.set(root.querySelector('[data-mark]'),    { opacity: 0, translateY: -30 });
    anime.set(root.querySelector('[data-eyebrow]'), { opacity: 0 });
    anime.set(root.querySelector('[data-word]'),    { clipPath: 'inset(0 50% 0 50%)' });
    anime.set(root.querySelector('[data-h1]'),      { opacity: 0, translateY: 8 });
    anime.set(root.querySelector('[data-sub]'),     { opacity: 0 });
    anime.set(root.querySelector('[data-form]'),    { opacity: 0, translateY: 14 });
    anime.set(root.querySelector('[data-fine]'),    { opacity: 0 });

    anime.timeline()
      .add({ targets: root.querySelector('[data-word]'), clipPath: ['inset(0 50% 0 50%)', 'inset(0 0% 0 0%)'], easing: 'easeOutCubic', duration: 760, delay: 200 })
      .add({ targets: root.querySelector('[data-toprow]'), opacity: [0, 1], easing: 'linear', duration: 20, offset: '-=360' })
      .add({ targets: root.querySelector('[data-mark]'), opacity: [0, 1], translateY: [-30, 0], easing: 'easeOutBack', duration: 520, offset: '-=20' })
      .add({ targets: root.querySelector('[data-eyebrow]'), opacity: [0, 1], easing: 'easeOutCubic', duration: 360, offset: '-=300' })
      .add({ targets: root.querySelector('[data-h1]'), opacity: [0, 1], translateY: [8, 0], easing: 'easeOutCubic', duration: 500, offset: '-=200' })
      .add({ targets: root.querySelector('[data-sub]'), opacity: [0, 1], easing: 'easeOutCubic', duration: 460, offset: '-=280' })
      .add({ targets: root.querySelector('[data-form]'), opacity: [0, 1], translateY: [14, 0], easing: 'easeOutBack', duration: 620, offset: '-=240' })
      .add({ targets: root.querySelector('[data-fine]'), opacity: [0, 1], easing: 'easeOutCubic', duration: 360, offset: '-=200' });
  }

  (async () => {
    try { await document.fonts.ready; } catch (e) {}
    play();
  })();

  const form = root.querySelector('[data-cta-form]');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const data = Object.fromEntries(new FormData(form).entries());
    const detail = { variant: 'v4-inline', context: 'footer-or-inline', data };
    window.dispatchEvent(new CustomEvent('cta:submit', { detail }));
    if (window.parent !== window) {
      try { window.parent.postMessage({ type: 'cta:submit', ...detail }, '*'); } catch (e) {}
    }
    root.classList.add('done');
  });

  if (window.parent !== window) {
    const post = () => {
      try {
        window.parent.postMessage({ type: 'cta:resize', variant: 'v4-inline', height: document.documentElement.scrollHeight }, '*');
      } catch (e) {}
    };
    new ResizeObserver(post).observe(document.documentElement);
    setTimeout(post, 50);
  }
})();
</script>
</body>
</html>
