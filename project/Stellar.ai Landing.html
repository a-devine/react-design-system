<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Stellar.ai — Work Smarter. Move Faster.</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/lucide-react@0.453.0/dist/umd/lucide-react.min.js"></script>

<style>
  html, body { background: #fff; }
  body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; color: #000; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in-up {
    animation: fadeInUp 0.6s ease-out forwards;
  }

  @keyframes fadeInOverlay {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .animate-fade-in-overlay {
    animation: fadeInOverlay 0.4s ease-out forwards;
  }

  @keyframes fadeInDialog {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .animate-slide-up-overlay {
    animation: fadeInDialog 0.5s ease-out forwards;
    transform: translate(-50%, -50%);
  }

  /* Logo wordmark base */
  .wm { letter-spacing: 0.18em; font-weight: 700; color: #6b7280; }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useRef } = React;
    const {
      Star, ChevronDown, BarChart3, BookOpen, Users, Rocket,
      Check, CheckCircle2, Circle, Sparkles, Wand2, Database,
      Cpu, ShieldCheck, Activity, Play, ArrowUpRight, Globe,
      Server, GitBranch, Zap,
    } = lucideReact;

    /* ----------------------------- NAV ----------------------------- */
    function Nav() {
      const navItems = [
        { label: 'Solutions', chev: true },
        { label: 'For Teams', chev: true },
        { label: 'About Us' },
        { label: 'Learn Hub' },
      ];
      return (
        <nav
          className="px-6 py-4 flex items-center justify-between max-w-7xl mx-auto animate-fade-in-up"
          style={{ opacity: 0, animationDelay: '0.1s' }}
        >
          <div className="flex items-center gap-2">
            <Star className="w-5 h-5 fill-black text-black" strokeWidth={1.5} />
            <span className="text-lg font-semibold tracking-tight">Stellar.ai</span>
          </div>

          <div className="hidden md:flex items-center gap-8">
            {navItems.map((n) => (
              <a
                key={n.label}
                href="#"
                className="text-sm text-gray-700 hover:text-black inline-flex items-center gap-1 transition-colors"
              >
                {n.label}
                {n.chev && <ChevronDown className="w-3.5 h-3.5" />}
              </a>
            ))}
          </div>

          <div className="flex items-center gap-4">
            <a href="#" className="text-sm text-gray-700 hover:text-black hidden sm:inline">Login</a>
            <button className="bg-black text-white px-5 py-2.5 rounded-full text-sm font-medium hover:bg-gray-800 transition-colors">
              Get started free
            </button>
          </div>
        </nav>
      );
    }

    /* ---------------------- REVIEWS BADGE -------------------------- */
    function ReviewsBadge() {
      return (
        <div
          className="inline-flex items-center gap-2 mb-8 animate-fade-in-up"
          style={{ opacity: 0, animationDelay: '0.2s' }}
        >
          <div className="w-6 h-6 border border-gray-300 rounded flex items-center justify-center">
            <Star className="w-3.5 h-3.5 fill-black text-black" strokeWidth={1.5} />
          </div>
          <span className="text-sm font-medium text-black">
            4.9 rating from 18.3K+ users
          </span>
        </div>
      );
    }

    /* ------------------------- TAB BAR ----------------------------- */
    const TABS = [
      { id: 'analyse', label: 'Analyse', Icon: BarChart3 },
      { id: 'train',   label: 'Train',   Icon: BookOpen  },
      { id: 'testing', label: 'Testing', Icon: Users     },
      { id: 'deploy',  label: 'Deploy',  Icon: Rocket    },
    ];

    function TabBar({ active, setActive }) {
      return (
        <div
          className="flex justify-center mb-8 animate-fade-in-up"
          style={{ opacity: 0, animationDelay: '0.6s' }}
        >
          {/* Mobile */}
          <div className="md:hidden bg-gray-100 rounded-lg p-1 grid grid-cols-2 gap-1 w-full max-w-sm">
            {TABS.map(({ id, label, Icon }) => {
              const isActive = active === id;
              return (
                <button
                  key={id}
                  onClick={() => setActive(id)}
                  className={
                    'flex items-center justify-center gap-2 px-4 py-2.5 rounded-md text-sm font-medium transition-all ' +
                    (isActive
                      ? 'bg-white text-black shadow-sm'
                      : 'text-gray-600 hover:text-black')
                  }
                >
                  <Icon className="w-4 h-4" />
                  {label}
                </button>
              );
            })}
          </div>

          {/* Desktop */}
          <div className="hidden md:flex items-center bg-gray-100 rounded-lg p-1">
            {TABS.map(({ id, label, Icon }, i) => {
              const isActive = active === id;
              return (
                <React.Fragment key={id}>
                  <button
                    onClick={() => setActive(id)}
                    className={
                      'flex items-center gap-2 px-5 py-2 rounded-md text-sm font-medium transition-all ' +
                      (isActive
                        ? 'bg-white text-black shadow-sm'
                        : 'text-gray-600 hover:text-black')
                    }
                  >
                    <Icon className="w-4 h-4" />
                    {label}
                  </button>
                  {i < TABS.length - 1 && !isActive && active !== TABS[i+1].id && (
                    <div className="w-px h-5 bg-gray-300 mx-0.5" />
                  )}
                  {i < TABS.length - 1 && (isActive || active === TABS[i+1].id) && (
                    <div className="w-px h-5 bg-transparent mx-0.5" />
                  )}
                </React.Fragment>
              );
            })}
          </div>
        </div>
      );
    }

    /* ------------------- OVERLAY CARD WRAPPER ---------------------- */
    function OverlayCard({ children, width = 'w-[480px]' }) {
      return (
        <div className="absolute inset-0 bg-black/30 animate-fade-in-overlay">
          <div
            className={
              'absolute left-1/2 top-1/2 bg-white rounded-2xl shadow-2xl overflow-hidden animate-slide-up-overlay ' +
              width + ' max-w-[92%]'
            }
          >
            {children}
          </div>
        </div>
      );
    }

    /* ------------------- ANALYSE OVERLAY --------------------------- */
    function AnalyseOverlay() {
      const steps = [
        { label: 'Connect data sources', done: true,  active: false },
        { label: 'Define workspace goals', done: false, active: true  },
        { label: 'Invite teammates',       done: false, active: false },
        { label: 'Review setup',           done: false, active: false },
      ];
      return (
        <OverlayCard>
          <div className="p-6">
            <div className="flex items-center gap-3 mb-1">
              <div className="w-9 h-9 rounded-lg bg-purple-100 flex items-center justify-center">
                <Wand2 className="w-4.5 h-4.5 text-purple-600" />
              </div>
              <div>
                <div className="text-base font-semibold">Set Up Your AI Workspace</div>
                <div className="text-xs text-gray-500">Step 1 of 4 · ~2 min remaining</div>
              </div>
            </div>

            <div className="mt-5 mb-5">
              <div className="flex justify-between text-xs text-gray-600 mb-1.5">
                <span>Progress</span>
                <span>25%</span>
              </div>
              <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                <div className="h-full bg-purple-500 rounded-full" style={{ width: '25%' }} />
              </div>
            </div>

            <div className="space-y-2">
              {steps.map((s, i) => (
                <div
                  key={i}
                  className={
                    'flex items-center gap-3 px-3 py-2.5 rounded-lg border ' +
                    (s.active ? 'border-purple-200 bg-purple-50/60' : 'border-gray-100')
                  }
                >
                  {s.done ? (
                    <CheckCircle2 className="w-4.5 h-4.5 text-purple-600 fill-purple-100" />
                  ) : s.active ? (
                    <div className="w-4.5 h-4.5 rounded-full border-2 border-purple-500 flex items-center justify-center">
                      <div className="w-1.5 h-1.5 rounded-full bg-purple-500" />
                    </div>
                  ) : (
                    <Circle className="w-4.5 h-4.5 text-gray-300" />
                  )}
                  <span className={'text-sm ' + (s.active ? 'text-black font-medium' : s.done ? 'text-gray-500 line-through' : 'text-gray-700')}>
                    {s.label}
                  </span>
                </div>
              ))}
            </div>

            <div className="mt-5 flex justify-end gap-2">
              <button className="px-4 py-2 text-sm text-gray-600 hover:text-black">Skip</button>
              <button className="px-4 py-2 text-sm font-medium bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                Continue
              </button>
            </div>
          </div>
        </OverlayCard>
      );
    }

    /* ---------------------- TRAIN OVERLAY -------------------------- */
    function TrainOverlay() {
      const metrics = [
        { label: 'Accuracy',  value: '94.2%', delta: '+1.4', tone: 'text-emerald-600' },
        { label: 'Loss',      value: '0.082', delta: '-0.01', tone: 'text-emerald-600' },
        { label: 'Epoch',     value: '14 / 21', delta: '67%',  tone: 'text-orange-600' },
        { label: 'ETA',       value: '18m 42s', delta: 'stable', tone: 'text-gray-500' },
      ];
      return (
        <OverlayCard width="w-[520px]">
          <div className="p-6">
            <div className="flex items-center gap-3 mb-1">
              <div className="w-9 h-9 rounded-lg bg-orange-100 flex items-center justify-center">
                <Cpu className="w-4.5 h-4.5 text-orange-600" />
              </div>
              <div className="flex-1">
                <div className="text-base font-semibold">AI Model Training</div>
                <div className="text-xs text-gray-500">stellar-base-v3 · running on 4× A100</div>
              </div>
              <span className="text-xs px-2 py-1 rounded-full bg-orange-100 text-orange-700 font-medium">
                Training
              </span>
            </div>

            <div className="mt-5 mb-5">
              <div className="flex justify-between text-xs text-gray-600 mb-1.5">
                <span>Epoch 14 of 21</span>
                <span>67%</span>
              </div>
              <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                <div className="h-full bg-orange-500 rounded-full" style={{ width: '67%' }} />
              </div>
            </div>

            <div className="grid grid-cols-2 gap-3">
              {metrics.map((m, i) => (
                <div key={i} className="px-3 py-2.5 rounded-lg border border-gray-100">
                  <div className="text-xs text-gray-500">{m.label}</div>
                  <div className="flex items-baseline justify-between mt-0.5">
                    <span className="text-base font-semibold tabular-nums">{m.value}</span>
                    <span className={'text-xs font-medium ' + m.tone}>{m.delta}</span>
                  </div>
                </div>
              ))}
            </div>

            <div className="mt-5 flex items-center justify-between">
              <div className="flex items-center gap-2 text-xs text-gray-500">
                <Activity className="w-3.5 h-3.5" />
                Logs streaming · 412 lines/min
              </div>
              <button className="px-4 py-2 text-sm font-medium border border-gray-200 rounded-lg hover:bg-gray-50">
                Pause training
              </button>
            </div>
          </div>
        </OverlayCard>
      );
    }

    /* --------------------- TESTING OVERLAY ------------------------- */
    function TestingOverlay() {
      const suites = [
        { name: 'Intent classification', pass: 42, total: 42 },
        { name: 'Tone & safety guardrails', pass: 31, total: 31 },
        { name: 'Tool-use & function calls', pass: 28, total: 28 },
        { name: 'Latency budget', pass: 26, total: 26 },
      ];
      return (
        <OverlayCard width="w-[500px]">
          <div className="p-6">
            <div className="flex items-center gap-3 mb-1">
              <div className="w-9 h-9 rounded-lg bg-emerald-100 flex items-center justify-center">
                <ShieldCheck className="w-4.5 h-4.5 text-emerald-600" />
              </div>
              <div className="flex-1">
                <div className="text-base font-semibold">Test Suite Results</div>
                <div className="text-xs text-gray-500">Ran on commit a1f8e2 · 3.4s</div>
              </div>
              <span className="text-xs px-2 py-1 rounded-full bg-emerald-100 text-emerald-700 font-medium">
                All passed
              </span>
            </div>

            <div className="mt-5 mb-4 flex items-end gap-2">
              <div className="text-4xl font-semibold tabular-nums leading-none">127</div>
              <div className="text-sm text-gray-500 mb-0.5">/ 127 tests</div>
            </div>
            <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden mb-5">
              <div className="h-full bg-emerald-500 rounded-full" style={{ width: '100%' }} />
            </div>

            <div className="space-y-2">
              {suites.map((s, i) => (
                <div key={i} className="flex items-center justify-between px-3 py-2.5 rounded-lg border border-gray-100">
                  <div className="flex items-center gap-2.5">
                    <CheckCircle2 className="w-4.5 h-4.5 text-emerald-600" />
                    <span className="text-sm text-black">{s.name}</span>
                  </div>
                  <span className="text-xs text-gray-500 tabular-nums">{s.pass}/{s.total}</span>
                </div>
              ))}
            </div>
          </div>
        </OverlayCard>
      );
    }

    /* --------------------- DEPLOY OVERLAY -------------------------- */
    function DeployOverlay() {
      const items = [
        { label: 'Build artifact verified', icon: Check },
        { label: 'Security & policy checks',  icon: ShieldCheck },
        { label: 'Region: us-east, eu-west',  icon: Globe },
        { label: 'Rollout strategy: canary 10%', icon: GitBranch },
      ];
      return (
        <OverlayCard width="w-[500px]">
          <div className="p-6">
            <div className="flex items-center gap-3 mb-1">
              <div className="w-9 h-9 rounded-lg bg-blue-100 flex items-center justify-center">
                <Rocket className="w-4.5 h-4.5 text-blue-600" />
              </div>
              <div className="flex-1">
                <div className="text-base font-semibold">Deploy to Production</div>
                <div className="text-xs text-gray-500">v3.4.1 · build #2,481</div>
              </div>
              <span className="text-xs px-2 py-1 rounded-full bg-blue-100 text-blue-700 font-medium">
                Ready
              </span>
            </div>

            <div className="mt-5 space-y-2">
              {items.map(({ label, icon: I }, i) => (
                <div key={i} className="flex items-center gap-3 px-3 py-2.5 rounded-lg border border-gray-100">
                  <div className="w-7 h-7 rounded-md bg-gray-50 flex items-center justify-center">
                    <I className="w-4 h-4 text-gray-700" />
                  </div>
                  <span className="text-sm text-black flex-1">{label}</span>
                  <Check className="w-4 h-4 text-emerald-600" />
                </div>
              ))}
            </div>

            <div className="mt-5 flex items-center justify-between">
              <div className="flex items-center gap-2 text-xs text-gray-500">
                <Server className="w-3.5 h-3.5" />
                12 nodes online
              </div>
              <button className="px-5 py-2.5 text-sm font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 inline-flex items-center gap-1.5">
                Deploy Now
                <Zap className="w-3.5 h-3.5" />
              </button>
            </div>
          </div>
        </OverlayCard>
      );
    }

    /* --------------- VIDEO + OVERLAY SECTION ----------------------- */
    function VideoSection({ active }) {
      const overlay = {
        analyse: <AnalyseOverlay key="a" />,
        train:   <TrainOverlay   key="t" />,
        testing: <TestingOverlay key="te" />,
        deploy:  <DeployOverlay  key="d" />,
      }[active];

      return (
        <div
          className="relative rounded-3xl overflow-hidden h-[400px] md:h-[500px] animate-fade-in-up bg-gradient-to-br from-slate-800 via-slate-900 to-black"
          style={{ opacity: 0, animationDelay: '0.7s' }}
        >
          {/* Placeholder background (video src omitted to keep this self-contained) */}
          <div className="absolute inset-0 opacity-60"
               style={{
                 backgroundImage:
                   'radial-gradient(circle at 20% 30%, rgba(139,92,246,0.45), transparent 45%),' +
                   'radial-gradient(circle at 80% 70%, rgba(59,130,246,0.4), transparent 50%),' +
                   'radial-gradient(circle at 50% 90%, rgba(236,72,153,0.3), transparent 55%)'
               }}
          />
          <div className="absolute inset-0"
               style={{
                 backgroundImage:
                   'repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 64px),' +
                   'repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 64px)'
               }}
          />
          <div className="absolute top-6 left-6 flex items-center gap-2 text-white/70 text-xs uppercase tracking-widest">
            <Play className="w-3.5 h-3.5" /> Live demo · {active}
          </div>

          {overlay}
        </div>
      );
    }

    /* --------------------- COMPANY LOGOS --------------------------- */
    function CompanyLogos() {
      return (
        <div
          className="mt-24 flex flex-wrap items-center justify-center gap-x-12 gap-y-6 animate-fade-in-up"
          style={{ opacity: 0, animationDelay: '0.8s' }}
        >
          <span className="wm text-base">INTERSCOPE</span>
          <span className="wm text-base">SPOTIFY</span>

          {/* Nexera (dot grid) */}
          <span className="flex items-center gap-2 text-gray-500 font-semibold tracking-wide">
            <span className="grid grid-cols-3 gap-0.5">
              {Array.from({ length: 9 }).map((_, i) => (
                <span key={i} className="w-1 h-1 rounded-full bg-gray-400" />
              ))}
            </span>
            Nexera
          </span>

          {/* M3 (serif italic) */}
          <span className="text-gray-500 italic text-2xl" style={{ fontFamily: 'Georgia, serif' }}>
            M<span className="text-base align-super">3</span>
          </span>

          {/* LAURA COLE with LC circle */}
          <span className="flex items-center gap-2">
            <span className="w-6 h-6 rounded-full border border-gray-400 flex items-center justify-center text-[10px] font-semibold text-gray-500">
              LC
            </span>
            <span className="wm text-sm">LAURA COLE</span>
          </span>

          {/* vertex (dots) */}
          <span className="flex items-center gap-1.5 text-gray-500 font-medium tracking-tight lowercase text-lg">
            <span className="flex gap-0.5">
              <span className="w-1.5 h-1.5 rounded-full bg-gray-400" />
              <span className="w-1.5 h-1.5 rounded-full bg-gray-400" />
              <span className="w-1.5 h-1.5 rounded-full bg-gray-400" />
            </span>
            vertex
          </span>
        </div>
      );
    }

    /* --------------------------- HERO ------------------------------ */
    function Hero() {
      const [active, setActive] = useState('analyse');
      const userInteracted = useRef(false);

      useEffect(() => {
        const id = setInterval(() => {
          if (userInteracted.current) return;
          setActive((prev) => {
            const idx = TABS.findIndex((t) => t.id === prev);
            return TABS[(idx + 1) % TABS.length].id;
          });
        }, 4000);
        return () => clearInterval(id);
      }, []);

      const handleSet = (id) => {
        userInteracted.current = true;
        setActive(id);
      };

      return (
        <section className="px-6 pt-24 pb-32 max-w-7xl mx-auto text-center">
          <ReviewsBadge />

          <h1
            className="text-6xl md:text-7xl lg:text-[80px] font-normal leading-[1.1] tracking-tight mb-5 animate-fade-in-up"
            style={{ opacity: 0, animationDelay: '0.3s' }}
          >
            <div>Work Smarter. Move Faster.</div>
            <div className="bg-gradient-to-r from-black via-gray-500 to-gray-400 bg-clip-text text-transparent">
              AI Powers You Up.
            </div>
          </h1>

          <p
            className="text-lg md:text-xl text-gray-600 mb-8 max-w-2xl mx-auto animate-fade-in-up"
            style={{ opacity: 0, animationDelay: '0.4s' }}
          >
            Intelligent automation syncs with the tools you love to streamline tasks,
            boost output, and save time.
          </p>

          <div
            className="animate-fade-in-up mb-12"
            style={{ opacity: 0, animationDelay: '0.5s' }}
          >
            <button className="bg-black text-white px-8 py-3 rounded-full text-base font-medium hover:bg-gray-800 transition-colors inline-flex items-center gap-2">
              Begin Free Trial
              <ArrowUpRight className="w-4 h-4" />
            </button>
          </div>

          <TabBar active={active} setActive={handleSet} />
          <VideoSection active={active} />

          <CompanyLogos />
        </section>
      );
    }

    function App() {
      return (
        <div className="bg-white min-h-screen">
          <Nav />
          <Hero />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
